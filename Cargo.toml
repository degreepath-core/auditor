[package]
name = "degreepath"
version = "0.1.0"
authors = ["Hawken Rives <rives@stolaf.edu>"]
edition = "2024"
rust-version = "1.99"

[workspace]

[[bin]]
name = "dp-report"
path = "src/dp-report.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6", features = ["derive"] }
dp-formatter = { path = "./formatter" }
dp-reports = { path = "./reports" }
