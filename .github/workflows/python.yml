---
name: Test and Publish

'on':
  - push

jobs:
  cpython-test:
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 4
      matrix:
        python-version: ['3.15']

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.7'
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint with flake8
        run: |
          uv run flake8 --count --show-source --statistics dp/

      - name: Check with mypy
        run: |
          uv run mypy --pretty dp/

      - name: Test with pytest
        run: |
          uv run pytest tests/ dp/

  check-runs:
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 4
      matrix:
        python-version: ['3.15']

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.7'
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-default-groups

      - name: Test that the thing runs
        run: |
          uv run python -m dp --help
          uv run python -m dp.bin.validate --help
          uv run python -m dp.bin.discover --help
          uv run python -m dp.bin.fixture --help

  rust-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # rustup reads rust-toolchain.toml and installs the pinned toolchain
      - name: Build
        run: cargo build --locked --release --bin dp-report

      - name: Test that the thing runs
        run: ./target/release/dp-report --help

  github-registry:
    if: github.ref == 'refs/heads/stable'
    runs-on: ubuntu-latest
    needs:
      - cpython-test
      - rust-build

    permissions:
      contents: read
      packages: write

    env:
      REPO: ghcr.io/degreepath-core/degreepath

    steps:
      - uses: actions/checkout@v7

      - name: Login
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and Publish
        run: |
          TAG="$(date +%s)"

          # the first publish to this namespace has no previous image to reuse
          docker pull "$REPO:stable" || true
          docker build . --file Dockerfile --tag "$REPO:$TAG" --cache-from "$REPO:stable" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}"

          docker run -t "$REPO:$TAG" uv run --no-sync python -m dp --help

          docker push "$REPO:$TAG"

          BRANCH="${GITHUB_REF#refs/heads/}"
          docker tag "$REPO:$TAG" "$REPO:$BRANCH"
          docker push "$REPO:$BRANCH"
