[package]
name = "dp-reports"
version = "0.1.0"
authors = ["Hawken Rives <rives@stolaf.edu>"]
edition = "2024"
rust-version = "1.99"

[lib]
name = "reports"
path = "src/lib.rs"

[dependencies]
dp-formatter = { path = "../formatter" }
postgres = { version = "0.19.14", features = ["with-serde_json-1"] }
postgres-openssl = "0.5.3"
openssl = { version = "0.10.82", features = ["vendored"] }
dotenvy = "0.15.7"
anyhow = "1.0.104"
indexmap = "2.14"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
askama_escape = "0.16"
itertools = "0.15"
